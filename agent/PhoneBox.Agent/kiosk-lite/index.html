<!doctype html>
<html lang="en">
<head>
<!-- Generated by tools/kiosk-lite/build.mjs: the phone's panel for older browsers (web kiosk lite). -->
<script>(function(){var ok=false;try{ok='noModule' in HTMLScriptElement.prototype&&!!(window.CSS&&CSS.supports&&CSS.supports('color','var(--x)'));}catch(e){}if(ok)return;document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="font:18px sans-serif;color:#e8eaf0;background:#0b0d12;position:fixed;top:0;left:0;right:0;bottom:0;padding:24px;line-height:1.5">'+'<b>This browser is too old for the PhoneBox kiosk.</b><br>On Android 4.4, install Firefox 68 (the last version for Android 4.4) and open this address there. On other devices, use a current browser.</div>';});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PhoneBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Pages and widgets are built by main.js and widgets/*.js from the layout designed in the agent's settings page. -->
<div id="pager"></div>

<nav id="dots" title="All pages"></nav>
<div id="ptitle"></div>

<div id="overview" hidden>
  <div class="ov-head">All pages <small>tap one to jump · volume keys flip pages · long-press a page to come back here</small><span id="ovPcs"></span><button class="ov-pc" id="ovRules" hidden></button></div>
  <div id="ovGrid"></div>
</div>

<div class="p-sheet" id="pSheet" hidden>
  <div class="ps-head">
    <div class="p-ico" id="psIco"></div>
    <div class="ps-title"><b id="psTitle"></b><small id="psSub"></small></div>
    <button class="ps-btn danger" id="psAll">End all</button>
    <button class="ps-btn" id="psClose" aria-label="Close">✕</button>
  </div>
  <div class="ps-list" id="psList"></div>
</div>

<div id="approval" hidden>
  <div class="ap-card">
    <div class="ap-head"><span class="ap-logo">✳</span><span id="apSource">Claude Code</span><span class="ap-sep">·</span><span id="apProject"></span><span class="ap-count" id="apCount"></span></div>
    <div class="ap-tool" id="apTool"></div>
    <div class="ap-desc" id="apDesc"></div>
    <pre class="ap-detail" id="apDetail"></pre>
    <div class="ap-foot">
      <span class="ap-time" id="apTime"></span>
      <button class="ap-btn deny" id="apDeny">Deny</button>
      <button class="ap-btn allow" id="apAllow">Allow</button>
      <button class="ap-btn allow" id="apSkip" hidden>Got it</button>
    </div>
  </div>
</div>

<!-- calm page switching: countdown before a rule (or the idle return) changes the page, and a chip while it waits -->
<div id="navCard" role="status">
  <div class="nv-ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle id="nvRing" cx="22" cy="22" r="19" pathLength="100"/></svg><b id="nvNum">3</b></div>
  <div class="nv-text"><b id="nvName"></b><span id="nvLine"></span><small id="nvDetail"></small></div>
  <button class="nv-btn" id="nvStay">Stay</button>
  <button class="nv-btn go" id="nvGo">Go now</button>
</div>
<div id="navChip"><button id="ncGo"><span>⏳</span><b id="ncText"></b><small id="ncWhy"></small></button><button id="ncX" aria-label="Dismiss">✕</button></div>

<div class="toast" id="toast"></div>
<div id="offline">PC not connected</div>
<div id="night"><div id="nClock">--:--</div><div id="nDate"></div></div>

<script src="polyfill.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
